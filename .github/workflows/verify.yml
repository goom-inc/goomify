name: Verify playable prototype
on:
  push:
    branches: [main, feat/worlds-playable-prototype]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check, test and build without external dependencies
        run: npm run check
      - name: Store the static preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: worlds-static-preview
          path: dist
          retention-days: 7
